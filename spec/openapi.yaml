# ─────────────────────────────────────────────────────────────────────────────
#  GENERATED FILE — DO NOT EDIT
#
#  Authored in the Sanbuk backend and published here automatically whenever the
#  contract changes. Edits made in this repository are overwritten by the next
#  sync; open an issue instead.
# ─────────────────────────────────────────────────────────────────────────────

openapi: 3.1.0
info:
  title: Sanbuk Tracking API
  version: 0.20.0
  description: |
    Two halves. **Advertisers** report conversions; **publishers** ask for ads and report
    what happened to them. Most integrators need only one half.

    ## Advertisers

    Two endpoints are all an advertiser ever calls — three if the app you are advertising
    measures installs through an MMP.

    **Postback (server to server)** is the financial source of truth: only a postback can
    create a payable conversion. **Pixel (browser)** is verification and anti-fraud only and
    is never billable on its own. Send the *same* `event_id` on both and Sanbuk pairs them
    inside a 48-hour window — that pairing is the only thing we ask you to get right.

    Integration checklist:

    1. Keep the `snbk_cid` query parameter you receive on your landing page, next to the
       order or user it belongs to. It is the click id, and without it a conversion cannot
       be attributed to a publisher.
    2. Send `event_id` as something you already own and never reuse — an order id works.
       A repeated `event_id` returns `200` and changes nothing, so retrying is always safe.
    3. Rehearse with `X-Sanbuk-Mode: test` until the action reads "verified" in the panel.
       A test event verifies your setup but never spends your wallet.
    4. Drop the header to go live.

    **App campaigns** attribute installs one of two ways. If your app uses a measurement
    partner (Metrix, AdTrace, AppMetrica…), you never write code: paste the click
    parameters and the ready postback URL Sanbuk generates into your MMP's panel, and
    `/pb/{token}` below is what your MMP calls. If you have no MMP, Sanbuk builds the store
    link itself with the click id inside the store's Install Referrer, and your own server
    calls `/postback` exactly as a web campaign would.

    All monetary values are integers in **Rial**.

    ## Publishers

    A publisher normally installs a ready-made SDK — `ad.js` for the web, the Android SDK
    for apps, or one of the shells built on it. This section is for everyone else: a game
    engine, a framework, or a platform we do not ship a shell for. Everything those shells
    do is the four calls below, and they are documented here so you can do it yourself.

    The serving reply **describes** an ad — headline, body, image, call-to-action wording,
    brand colour. It is never markup. Draw it however suits your app; nothing here renders
    anything for you.

    Four obligations if you integrate directly. They are what the shipped SDKs do for you,
    and skipping them costs somebody money:

    1. **Count a view only when it was seen** — at least half the ad on screen for a
       continuous second. Reporting on render counts ads nobody scrolled to.
    2. **Send an `eid` with every impression** and reuse it when you retry. The counter has
       no event identity of its own, so a retried report without one is a second view — and
       a per-impression commission is paid on that number.
    3. **Open the click in a real browser**, never an in-app WebView. A WebView has its own
       cookie jar, the first-party click id does not survive it, and the conversion is never
       attributed — the publisher does the work and earns nothing.
    4. **Label the ad.** A reader has to be able to tell it from your own content.

    Media integrated this way are marked as such and watched a little more closely, for the
    plain reason that we cannot verify the first two from here.
servers:
  - url: https://t.sanbuk.com/v1
    description: production edge
tags:
  - name: conversion
    description: Conversion intake — postback and pixel
  - name: publisher
    description: Ad serving — asking for an ad, and reporting the view and the click

paths:
  /postback:
    post:
      tags: [conversion]
      operationId: sendPostback
      summary: Report a conversion from your server (billable)
      description: >
        Authenticated by your workspace API key as a Bearer token. Idempotent per
        (action, event_id) *within a mode*: a first-time event answers 202, a repeat answers
        200 and does nothing. A `test` rehearsal and its live twin are separate events, so
        rehearsing with a real order id never consumes it. The event's time is our receipt
        time — the contract carries no advertiser-supplied timestamp, so queue and retry
        freely but do not expect a backdated event to land on an earlier day. Rate limited
        per API key.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/SandboxMode' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PostbackBody' }
            examples:
              purchase:
                summary: A purchase with a dynamic value
                value:
                  action: purchase
                  event_id: ORD-10293
                  click_id: 018f3c2e-7b1a-7c3d-9e4f-1a2b3c4d5e6f
                  value: 25000000
                  params: { order_id: ORD-10293 }
              lead:
                summary: A lead with no value — lead_ref powers PII-free dedup
                value:
                  action: lead
                  event_id: LEAD-5501
                  click_id: 018f3c2e-7b1a-7c3d-9e4f-1a2b3c4d5e6f
                  params: { lead_ref: CRM-88412 }
      responses:
        '202':
          description: Accepted — queued for attribution
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestAccepted' }
        '200':
          description: Duplicate event_id — no-op, safe to retry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestAccepted' }
        '401':
          $ref: '#/components/responses/IngestError'
        '404':
          $ref: '#/components/responses/IngestError'
        '422':
          $ref: '#/components/responses/IngestError'
        '429':
          description: Rate limit exceeded for this API key — retry after the window

  /pb/{token}:
    get:
      security: []   # the path token IS the credential
      tags: [conversion]
      operationId: sendMmpPostback
      summary: Report a conversion from your MMP (billable)
      description: >
        The same intake as `/postback`, shaped for a measurement partner's panel, which can
        be given a URL and nothing else — no header, no body. The credential therefore
        travels in the path and opens exactly one capability: receiving a postback. Sanbuk
        generates the whole URL for you, per action, with your MMP's own macros already in
        place; you paste it into the postback slot for that event.


        Idempotency, the response codes and the sandbox rule are identical to `/postback`,
        so your MMP's automatic retries are safe. `value` is accepted as a decimal here,
        because every MMP's revenue macro renders one; it is recorded, never billed —
        what you pay comes from your campaign's own pricing.
      parameters:
        - name: token
          in: path
          required: true
          description: Your workspace's S2S token (`s2s_snbk_…`), from the panel's credentials card
          schema: { type: string }
        - name: action
          in: query
          required: true
          description: The action code, e.g. install_activate
          schema: { type: string, maxLength: 50 }
        - name: event_id
          in: query
          required: true
          description: >
            Your MMP's unique id for this install or event — its install-id or device macro.
            A repeat answers 200 and changes nothing.
          schema: { type: string, maxLength: 100 }
        - name: click_id
          in: query
          required: false
          description: >
            The click id Sanbuk put on the tracker link, echoed back by your MMP. Without it
            the event is recorded but nothing is attributed and nobody is paid.
          schema: { type: string, format: uuid }
        - name: value
          in: query
          required: false
          description: Revenue in Rial; required for actions with a dynamic value. Decimals are floored.
          schema: { type: number, minimum: 0 }
        - name: mode
          in: query
          required: false
          description: >
            `test` marks the call a rehearsal — it verifies your setup and never spends your
            wallet. Stands in for the X-Sanbuk-Mode header, which an MMP panel cannot send.
          schema: { type: string, enum: [test, live] }
      responses:
        '202':
          description: Accepted — queued for attribution
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestAccepted' }
        '200':
          description: Duplicate event_id — no-op, safe to retry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestAccepted' }
        '401':
          $ref: '#/components/responses/IngestError'
        '404':
          $ref: '#/components/responses/IngestError'
        '422':
          $ref: '#/components/responses/IngestError'
        '429':
          description: Rate limit exceeded for this token — retry after the window

  /pixel:
    post:
      security: []   # public — the pixel id is not a secret
      tags: [conversion]
      operationId: sendPixelEvent
      summary: Report the same conversion from the browser (verification only)
      description: >
        Identified by your public pixel id — no secret, so this is safe in page source. A
        pixel event never bills on its own; it exists so Sanbuk can confirm your postbacks
        and score fraud. Normally you do not call this directly: the `snbk` snippet does.
        Rate limited per pixel id.
      parameters: [{ $ref: '#/components/parameters/SandboxMode' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PixelBody' }
            examples:
              purchase:
                summary: Same event_id as the postback — this is what makes them pair
                value:
                  pixel_id: SNBK-PX-XXXXX
                  action: purchase
                  event_id: ORD-10293
                  value: 25000000
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestAccepted' }
        '200':
          description: Duplicate event_id — no-op
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestAccepted' }
        '404':
          $ref: '#/components/responses/IngestError'
        '422':
          $ref: '#/components/responses/IngestError'
        '429':
          description: Rate limit exceeded for this pixel id — retry after the window

  /ad:
    get:
      tags: [publisher]
      operationId: serveAd
      summary: Ask what to draw in one slot
      servers:
        - url: https://t.sanbuk.com
          description: production edge (these four are not under /v1)
      description: >
        Answers with an ad to draw, or with nothing. `{"ad": null}` is a normal answer, not
        an error: no campaign matched, the budget is spent, the slot is capped for today.
        Collapse the space or draw your own content — never treat it as a failure.
      parameters:
        - { name: placement, in: query, required: true, schema: { type: string, maxLength: 40 }, description: The slot code from the publisher panel }
        - { name: media, in: query, required: false, schema: { type: string, maxLength: 40 }, description: 'The media code; when given, the placement must belong to it' }
        - name: platform
          in: query
          required: false
          schema: { type: string, enum: [android, ios, web] }
          description: >
            What you run on. Send it from a native integration: it is believed over the user
            agent, and without it the campaigns that want app inventory are filtered out of
            the very inventory they are for.
        - name: package
          in: query
          required: false
          schema: { type: string, maxLength: 160 }
          description: >
            Android package name / iOS bundle id, matched against the package the publisher
            declared for this media.
        - name: install_id
          in: query
          required: false
          schema: { type: string, maxLength: 64 }
          description: >
            A random, resettable per-install id — never an advertising identifier. It is the
            rate-limit key that still means something behind carrier NAT, where an address is
            shared by tens of thousands of subscribers.
        - name: sdk
          in: query
          required: false
          schema: { type: string, maxLength: 40 }
          description: >
            Framework-tagged build, e.g. unity-1.2.0. See the kill field in the reply.
        - { name: app_version, in: query, required: false, schema: { type: string, maxLength: 40 } }
        - { name: os, in: query, required: false, schema: { type: string, maxLength: 40 }, description: 'The platform version a person would recognise ("13")' }
        - { name: conn, in: query, required: false, schema: { type: string, enum: [wifi, cellular] } }
        - name: render
          in: query
          required: false
          schema: { type: string, enum: [default, custom] }
          description: >
            Who draws it, and therefore whose judgement decided the view was real. Send
            `custom` when your own code draws the ad. Claiming `default` while drawing it
            yourself misreports how the impression was measured.
        - name: fc
          in: query
          required: false
          schema: { type: string, maxLength: 2000 }
          description: >
            Your own "campaignId:count" view counters, for the frequency cap. Distrusted and
            re-checked on our side; lying only ever loses the visitor some ads.
      responses:
        '200':
          description: The ad to draw, or null
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServeReply' }

  /i/{code}:
    get:
      tags: [publisher]
      operationId: reportImpression
      summary: Report that the ad was seen
      servers:
        - url: https://t.sanbuk.com
      description: >
        Call once the ad has really been on screen — at least half of it for a continuous
        second. Always answers a 1×1 gif, whatever happened, so a blocked or dead call can
        never break the page.
      parameters:
        - { name: code, in: path, required: true, schema: { type: string, maxLength: 40 }, description: The `code` from the serving reply }
        - name: eid
          in: query
          required: false
          schema: { type: string, maxLength: 64 }
          description: >
            Your own id for this view, minted when the view HAPPENS rather than when it is
            sent. Send the same one on every retry: the count has no event identity of its
            own, so without this a retried report is a second view — and money is paid on
            that number. Repeats are recognised and ignored for 48 hours.
        - { name: install_id, in: query, required: false, schema: { type: string, maxLength: 64 } }
        - name: v
          in: query
          required: false
          schema: { type: integer }
          description: >
            Cache buster for browsers, which otherwise reuse an identical image URL from
            memory and never send the second request.
      responses:
        '200':
          description: A 1×1 transparent gif, always
          content:
            image/gif: {}

  /c/{code}:
    get:
      tags: [publisher]
      operationId: followClick
      summary: Send the visitor to the advertiser
      servers:
        - url: https://t.sanbuk.com
      description: >
        Open this URL in a real browser — Custom Tabs on Android, SFSafariViewController on
        iOS, a normal navigation on the web. Do not follow the redirect in code and open the
        destination yourself: that spends the click and lands the visitor somewhere the
        tracker did not choose. An in-app WebView breaks attribution outright.
      parameters:
        - { name: code, in: path, required: true, schema: { type: string, maxLength: 40 } }
        - { name: sub_id, in: query, required: false, schema: { type: string, maxLength: 60 }, description: 'Your own label for this placement or segment; echoed back in reports' }
      responses:
        '302':
          description: Redirect to the advertiser. A dead link redirects to Sanbuk rather than to an error page — someone is mid-navigation.

  /sdk/ping:
    post:
      tags: [publisher]
      operationId: pingAppMedia
      summary: Verify an app media on first launch
      servers:
        - url: https://api.sanbuk.com/api/v1
          description: the app host, not the tracker edge
      security: []
      description: >
        A website media proves itself because the crawler can fetch the page and find the
        snippet. An app cannot be crawled, so first contact from inside the app is the
        proof. Call once per launch. Always answers 200 — an integration already shipped to
        phones must never hard-fail.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [media_code]
              properties:
                media_code: { type: string, maxLength: 16 }
                package_name:
                  type: [string, "null"]
                  maxLength: 160
                  description: >
                    Your app's own identifier. Required in practice once the publisher has
                    declared a package for the media: a code lifted from somebody's snippet
                    must not be able to verify a media the lifter does not own.
      responses:
        '200':
          description: '`ok` says whether the code matched an app media awaiting verification'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }

  /px.js:
    # The script lives at the edge root, not under the API prefix — the snippet
    # you paste into a page is a plain asset, not a versioned API call.
    servers:
      - url: https://t.sanbuk.com
        description: production edge
    get:
      security: []   # a public static asset
      tags: [conversion]
      operationId: getPixelScript
      summary: The tracking script the snippet loads
      description: >
        Served straight from the edge and cached. You normally never request it by
        hand: paste the snippet from the panel and it loads this file, which reads
        `snbk_cid` off the landing URL, keeps it in a first-party cookie and exposes
        `snbk('track', …)` for the pixel call above.
      responses:
        '200':
          description: The script
          content:
            application/javascript:
              schema: { type: string }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: The workspace API key, shown in the advertiser panel under the conversion action wizard.

  parameters:
    SandboxMode:
      name: X-Sanbuk-Mode
      in: header
      required: false
      description: >
        `test` marks the event a rehearsal: it is stored and still verifies the action, but
        never becomes a billable conversion. Anything else — including the header being
        absent — is live.
      schema: { type: string, enum: [live, test] }

  schemas:
    ServeReply:
      type: object
      properties:
        ad:
          oneOf:
            - $ref: '#/components/schemas/ServedAd'
            - type: "null"
          description: Null when nothing may be served — a normal answer, not an error
        kill:
          type: boolean
          description: >
            Stop asking until this build is updated. Sent when an SDK version we no longer
            answer identifies itself — a build below its framework's floor, one named
            individually, or all of them switched off. It is the only way to retire code
            that is already on people's phones, so honour it: a client that ignores this
            keeps asking for months.
        min_sdk:
          type: string
          description: The version this framework must reach, when that is why it was refused
        reason:
          type: string
          description: >
            Why the slot stayed empty. Only present while an operator has diagnostics on —
            production sends none, so never depend on it.
    ServedAd:
      type: object
      description: A description of an ad, never markup. Draw it however suits your app.
      properties:
        code: { type: string, description: The tracking link behind this decision; every URL below hangs off it }
        format: { type: string, enum: [banner, native, interstitial, rewarded], description: 'As the publisher registered the slot — not something a client chooses' }
        campaign_id: { type: string }
        creative_id: { type: string }
        headline: { type: [string, "null"] }
        description: { type: [string, "null"] }
        cta: { type: string, enum: [buy, view, learn, install, custom] }
        cta_label: { type: string, description: 'The words for the button, already resolved — a custom call to action is the advertiser''s own wording' }
        brand_color: { type: [string, "null"] }
        image_url: { type: [string, "null"] }
        logo_url: { type: [string, "null"] }
        click_url: { type: string, description: Open this in a real browser. Never follow the redirect yourself. }
        impression_url: { type: string }
        fc_hours: { type: integer, description: How long your per-campaign view counters stay relevant }
    PostbackBody:
      type: object
      required: [action, event_id]
      properties:
        action:
          type: string
          maxLength: 50
          description: >
            The action code exactly as the panel shows it for that action — copy it, do
            not derive it from the category: an action scoped to one brand carries a
            brand suffix, e.g. "purchase_banbar".
        event_id:
          type: string
          maxLength: 100
          description: >
            Your own idempotency key — an order id is ideal. Must be identical to the
            event_id the pixel sends for the same conversion.
        value:
          type: [integer, "null"]
          minimum: 0
          description: Rial. Required when the action's value mode is dynamic.
        click_id:
          type: [string, "null"]
          format: uuid
          description: >
            The `snbk_cid` you received on the landing page. Without it the event is
            recorded and verifies your setup, but nothing can be attributed or paid.
        params:
          type: object
          additionalProperties: true
          description: >
            Extra fields of your own. They are COMPARED against the params the
            action declares, never validated in the blocking sense: a declared
            param that does not arrive is reported in the panel's request log
            ("missing params") so you can fix the integration, and the event is
            still accepted and still billed. No params mismatch ever produces a
            422 or any other rejection.
            For lead actions, sending `lead_ref` — an opaque id from your CRM,
            or a hash you compute from the lead's phone — is strongly
            recommended: it powers duplicate detection without Sanbuk ever
            storing personal data. Optional; a postback without it is accepted.

    PixelBody:
      type: object
      required: [pixel_id, action, event_id]
      properties:
        pixel_id: { type: string, maxLength: 40 }
        action:
          type: string
          maxLength: 50
          description: >
            The same action code you send on the postback for this conversion — the two
            are paired on (action, event_id), so a mismatch never pairs.
        event_id: { type: string, maxLength: 100 }
        value: { type: [integer, "null"], minimum: 0 }
        click_id: { type: [string, "null"], format: uuid }

    IngestAccepted:
      type: object
      properties:
        status:
          type: string
          enum: [accepted, duplicate]
        event_id: { type: string }
        mode:
          type: string
          enum: [live, test]
          description: Which mode answered — check this to confirm your sandbox switch landed.

    IngestError:
      type: object
      required: [message, code]
      description: Branch on `code`; `message` is localised and may change.
      properties:
        message: { type: string }
        code:
          type: string
          enum: [invalid_api_key, invalid_pixel_id, unknown_action, value_required, validation_failed]
        errors:
          type: object
          description: Present only with `validation_failed` — field name to list of messages.
          additionalProperties:
            type: array
            items: { type: string }

  responses:
    IngestError:
      description: |
        Intake failure. `invalid_api_key` (401) — the Bearer key is missing or wrong.
        `invalid_pixel_id` (404) — no workspace owns that pixel id.
        `unknown_action` (404) — the action code is not defined in your workspace.
        `value_required` (422) — this action prices on value, so `value` is mandatory.
        `validation_failed` (422) — the body is malformed; `errors` names the offending fields.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/IngestError' }
